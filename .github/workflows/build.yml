name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: Snake
          options:
            deploymentTarget:
              iOS: "15.0"
          targets:
            Snake:
              type: application
              platform: iOS
              sources:
                - path: App.swift
                - path: index.html
                  buildPhase: resources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.snake.lcd
                  PRODUCT_NAME: Snake
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: "YES"
                  INFOPLIST_KEY_CFBundleDisplayName: Snake
                  INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
          EOF
          xcodegen generate

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project Snake.xcodeproj \
            -scheme Snake \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Snake.app Payload/
          zip -qry Snake.ipa Payload
          ls -lh Snake.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Snake-IPA
          path: Snake.ipa

# Ende der Datei
