<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snake LCD</title>
<style>
html { box-sizing: border-box; color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Press+Start+2P&display=swap">
<style>
/* Handheld LCD layout: score bar on top, square board in a bezel, d-pad below. */
:root {
  --bg: #b9c692;
  --lcd: #c9d6a3;
  --ghost: #b9c890;
  --ink: #26311b;
  --ink-soft: #46532f;
  --on-ink: #c9d6a3;
  --font-display: 'Press Start 2P', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121809;
    --lcd: #1a2310;
    --ghost: #243016;
    --ink: #a9c75a;
    --ink-soft: #7d9a43;
    --on-ink: #121809;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121809;
  --lcd: #1a2310;
  --ghost: #243016;
  --ink: #a9c75a;
  --ink-soft: #7d9a43;
  --on-ink: #121809;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 460px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.bar {
  width: 100%;
  display: flex;
  align-items: flex-end;
  gap: 22px;
}
.stat { display: flex; flex-direction: column; gap: 6px; }
.lab {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.val {
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.pause {
  margin-left: auto;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}

.frame {
  position: relative;
  flex: none;
  box-sizing: border-box;
  width: min(100%, 460px, calc(100vh - 400px));
  width: min(100%, 460px, calc(100svh - 400px));
  min-width: 220px;
  aspect-ratio: 1;
  max-width: 100%;
  border: 3px solid var(--ink);
  border-radius: 4px;
  background: var(--lcd);
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; }

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  pointer-events: none;
}
.card {
  pointer-events: auto;
  max-width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 16px 18px;
  text-align: center;
  background: var(--lcd);
  border: 3px solid var(--ink);
}
.card h2 {
  margin: 0;
  font: 400 14px/1.5 var(--font-display);
  text-wrap: balance;
}
.card p {
  margin: 0;
  font: 500 13px/1.45 var(--font-body);
  color: var(--ink-soft);
  text-wrap: balance;
}
.btn {
  min-height: 44px;
  padding: 10px 16px;
  font: 400 11px var(--font-display);
  color: var(--on-ink);
  background: var(--ink);
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}

.dpad {
  --k: clamp(46px, 14vw, 58px);
  display: grid;
  grid-template-columns: repeat(3, var(--k));
  grid-template-rows: repeat(3, var(--k));
  grid-template-areas: ". up ." "left . right" ". down .";
  gap: 6px;
}
.dpad button {
  display: grid;
  place-items: center;
  color: var(--on-ink);
  background: var(--ink);
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
.dpad button:active { transform: scale(0.94); }
.dpad .up { grid-area: up; }
.dpad .left { grid-area: left; }
.dpad .right { grid-area: right; }
.dpad .down { grid-area: down; }
.dpad svg, .pause svg { display: block; }

button:focus-visible { outline: 3px solid var(--ink-soft); outline-offset: 3px; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="stat"><span class="lab">Punkte</span><span class="val" id="score">000</span></div>
    <div class="stat"><span class="lab">Rekord</span><span class="val" id="best">000</span></div>
    <button class="pause" id="pauseBtn" type="button" aria-label="Pause">
      <svg id="icoPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
      <svg id="icoPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M6 4l14 8-14 8z"/></svg>
    </button>
  </header>

  <div class="frame" id="frame">
    <canvas id="board" aria-label="Spielfeld"></canvas>
    <div class="overlay" id="ov">
      <div class="card">
        <h2 id="ovT">Snake</h2>
        <p id="ovS">Wische über das Feld, um zu starten.</p>
        <button class="btn" id="ovB" type="button">Start</button>
      </div>
    </div>
  </div>

  <div class="dpad" aria-label="Steuerkreuz">
    <button class="up" type="button" data-dx="0" data-dy="-1" aria-label="Hoch"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="left" type="button" data-dx="-1" data-dy="0" aria-label="Links"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="right" type="button" data-dx="1" data-dy="0" aria-label="Rechts"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="down" type="button" data-dx="0" data-dy="1" aria-label="Runter"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
</div>

<script>
(function () {
  var N = 20;
  var BEST_KEY = 'snake-lcd-best';

  var frame = document.getElementById('frame');
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var ov = document.getElementById('ov');
  var ovT = document.getElementById('ovT');
  var ovS = document.getElementById('ovS');
  var ovB = document.getElementById('ovB');
  var pauseBtn = document.getElementById('pauseBtn');
  var icoPause = document.getElementById('icoPause');
  var icoPlay = document.getElementById('icoPlay');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');

  var snake, dir, queue, food, score, speed, state, timer;
  var best = 0;
  var cell = 0, side = 0;

  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { best = 0; }

  function pad3(n) { return String(n).padStart(3, '0'); }
  function token(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function placeFood() {
    var taken = {};
    snake.forEach(function (s) { taken[s.x + ',' + s.y] = true; });
    var free = [];
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (!taken[x + ',' + y]) free.push({ x: x, y: y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    clearTimeout(timer);
    snake = [{ x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    speed = 140;
    state = 'ready';
    placeFood();
    draw();
    updateUI();
    showOverlay('ready');
  }

  function updateUI() {
    scoreEl.textContent = pad3(score);
    bestEl.textContent = pad3(best);
    var paused = state === 'paused';
    icoPause.hidden = paused;
    icoPlay.hidden = !paused;
    pauseBtn.setAttribute('aria-label', paused ? 'Weiter' : 'Pause');
  }

  function showOverlay(mode, isBest) {
    if (!mode) { ov.hidden = true; return; }
    ov.hidden = false;
    if (mode === 'ready') {
      ovT.textContent = 'Snake';
      ovS.textContent = 'Wische über das Feld oder nutze das Steuerkreuz.';
      ovB.textContent = 'Start';
    } else if (mode === 'paused') {
      ovT.textContent = 'Pause';
      ovS.textContent = score + ' Punkte';
      ovB.textContent = 'Weiter';
    } else if (mode === 'won') {
      ovT.textContent = 'Geschafft';
      ovS.textContent = 'Das ganze Feld ist voll: ' + score + ' Punkte.';
      ovB.textContent = 'Nochmal';
    } else {
      ovT.textContent = 'Game Over';
      ovS.textContent = score + ' Punkte' + (isBest ? ', neuer Rekord!' : '');
      ovB.textContent = 'Nochmal';
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(step, speed);
  }

  function start() {
    if (state !== 'ready') return;
    state = 'running';
    showOverlay(null);
    updateUI();
    schedule();
  }

  function pause() {
    if (state !== 'running') return;
    clearTimeout(timer);
    state = 'paused';
    showOverlay('paused');
    updateUI();
  }

  function resume() {
    if (state !== 'paused') return;
    state = 'running';
    showOverlay(null);
    updateUI();
    schedule();
  }

  function finish(won) {
    clearTimeout(timer);
    state = 'over';
    var isBest = score > best;
    if (isBest) {
      best = score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    draw();
    updateUI();
    showOverlay(won ? 'won' : 'over', isBest);
  }

  function turn(dx, dy) {
    if (state === 'over') return;
    var last = queue.length ? queue[queue.length - 1] : dir;
    var reverse = dx === -last.x && dy === -last.y;
    var same = dx === last.x && dy === last.y;
    if (!reverse && !same && queue.length < 2) queue.push({ x: dx, y: dy });
    if (!reverse) {
      if (state === 'ready') start();
      else if (state === 'paused') resume();
    }
  }

  function step() {
    if (state !== 'running') return;
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var eating = head.x === food.x && head.y === food.y;
    var body = eating ? snake : snake.slice(0, -1);
    var hit = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      body.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hit) { finish(false); return; }
    snake.unshift(head);
    if (eating) {
      score += 1;
      speed = Math.max(70, speed - 3);
      if (snake.length >= N * N) { finish(true); return; }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    updateUI();
    schedule();
  }

  function sizeCanvas() {
    var r = canvas.getBoundingClientRect();
    var d = window.devicePixelRatio || 1;
    var px = Math.floor((r.width * d) / N) * N;
    if (px < N) return;
    canvas.width = px;
    canvas.height = px;
    side = px;
    cell = px / N;
  }

  function draw() {
    if (!cell) return;
    var lcd = token('--lcd');
    var ghost = token('--ghost');
    var ink = token('--ink');
    var x, y;

    ctx.fillStyle = lcd;
    ctx.fillRect(0, 0, side, side);

    var g = cell * 0.2;
    ctx.fillStyle = ghost;
    for (y = 0; y < N; y++) {
      for (x = 0; x < N; x++) {
        ctx.fillRect(x * cell + g, y * cell + g, cell - 2 * g, cell - 2 * g);
      }
    }

    ctx.fillStyle = ink;
    var p = cell * 0.07;
    snake.forEach(function (s) {
      ctx.fillRect(s.x * cell + p, s.y * cell + p, cell - 2 * p, cell - 2 * p);
    });

    var u = cell / 3;
    var q = cell * 0.02;
    [[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]].forEach(function (c) {
      ctx.fillRect(food.x * cell + c[0] * u + q, food.y * cell + c[1] * u + q, u - 2 * q, u - 2 * q);
    });

    var h = snake[0];
    var cx = (h.x + 0.5) * cell;
    var cy = (h.y + 0.5) * cell;
    var e = cell * 0.16;
    ctx.fillStyle = lcd;
    [-1, 1].forEach(function (sgn) {
      var ex = cx + dir.x * cell * 0.18 + -dir.y * sgn * cell * 0.2;
      var ey = cy + dir.y * cell * 0.18 + dir.x * sgn * cell * 0.2;
      ctx.fillRect(ex - e / 2, ey - e / 2, e, e);
    });
  }

  /* Swipe on the board */
  var tracking = false, swiped = false, sx = 0, sy = 0;
  frame.addEventListener('pointerdown', function (ev) {
    if (ev.target.closest('button')) return;
    tracking = true;
    swiped = false;
    sx = ev.clientX;
    sy = ev.clientY;
    try { frame.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  frame.addEventListener('pointermove', function (ev) {
    if (!tracking) return;
    var dx = ev.clientX - sx;
    var dy = ev.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    swiped = true;
    sx = ev.clientX;
    sy = ev.clientY;
  });
  frame.addEventListener('pointerup', function () {
    if (!tracking) return;
    tracking = false;
    if (!swiped && state === 'ready') start();
  });
  frame.addEventListener('pointercancel', function () { tracking = false; });

  /* D-pad */
  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (b) {
    var dx = Number(b.dataset.dx);
    var dy = Number(b.dataset.dy);
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); turn(dx, dy); });
    b.addEventListener('click', function (ev) { if (ev.detail === 0) turn(dx, dy); });
  });

  /* Buttons */
  ovB.addEventListener('click', function () {
    if (state === 'over') { reset(); start(); }
    else if (state === 'ready') start();
    else if (state === 'paused') resume();
  });
  pauseBtn.addEventListener('click', function () {
    if (state === 'running') pause();
    else if (state === 'paused') resume();
    else if (state === 'ready') start();
  });

  /* Keyboard */
  var keys = {
    ArrowUp: [0, -1], w: [0, -1],
    ArrowDown: [0, 1], s: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0]
  };
  window.addEventListener('keydown', function (ev) {
    var key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    var k = keys[key];
    if (k) { ev.preventDefault(); turn(k[0], k[1]); return; }
    if (ev.target.closest && ev.target.closest('button')) return;
    if (ev.key === ' ') { ev.preventDefault(); pauseBtn.click(); }
    else if (ev.key === 'Enter' && state === 'over') { ovB.click(); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause();
  });

  /* Redraw on size and theme changes */
  function relayout() { sizeCanvas(); draw(); }
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(canvas);
  else window.addEventListener('resize', relayout);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', draw);

  sizeCanvas();
  reset();
})();
</script>
</body>
</html>
